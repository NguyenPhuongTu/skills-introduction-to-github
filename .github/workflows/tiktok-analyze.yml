name: TikTok Analyze

# Tải + chép lời + trích khung hình + OCR một video TikTok, rồi commit kết quả vào tiktok/results/.
# Kích hoạt: sửa file tiktok/request.txt và push (bất kỳ nhánh nào), hoặc chạy tay (workflow_dispatch).

on:
  push:
    paths:
      - "tiktok/request.txt"
  workflow_dispatch:
    inputs:
      url:
        description: "Link TikTok"
        required: true
      lang:
        description: "Ngôn ngữ (vi, en... để trống = tự nhận)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tiktok-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tiktok/requirements.txt

      - name: Cài công cụ hệ thống
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-vie

      - name: Cài thư viện Python
        run: pip install -U -r tiktok/requirements.txt

      - name: Cache mô hình Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Ghi yêu cầu (khi chạy tay)
        if: github.event_name == 'workflow_dispatch'
        env:
          URL: ${{ inputs.url }}
          LANG_IN: ${{ inputs.lang }}
        run: |
          printf 'url=%s\nnonce=dispatch-%s\nlang=%s\n' "$URL" "$GITHUB_RUN_ID" "$LANG_IN" > tiktok/request.txt

      - name: Xử lý video
        env:
          MEDIA_OUT: ${{ runner.temp }}/media
        run: python tiktok/process.py --request tiktok/request.txt --out tiktok/results

      - name: Lưu video gốc (artifact 7 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-media-${{ github.run_id }}
          path: ${{ runner.temp }}/media
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit kết quả
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok/results tiktok/request.txt
          git diff --cached --quiet && exit 0
          git commit -m "TikTok: kết quả phân tích (run ${GITHUB_RUN_ID})"
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*5)); git pull --no-rebase --no-edit origin "${GITHUB_REF_NAME}"
          done
          exit 1
